name: Build Android APK (PWA Offline)

on:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v3

  - name: Setup Node.js
    uses: actions/setup-node@v3
    with:
      node-version: '18'

  - name: Set up Java Development Kit
    uses: actions/setup-java@v3
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v2

  - name: Install Bubblewrap CLI
    run: npm install -g @bubblewrap/cli

  - name: Build and Sign APK
    run: |
      mkdir -p android-project
      # Usamos respuestas predeterminadas automáticas (retornos de carro) para que Bubblewrap no se quede esperando interactivamente en la nube.
      echo -e "\n\n\n\n\n\n\n\n\n\n\n\n" | bubblewrap init --manifest=data:application/json;base64, --directory=./android-project --meta-data=./index.html
      cd android-project
      # Generar contraseñas ficticias para firmar la versión de desarrollo / prueba de manera automática
      export BUBBLEWRAP_KEYSTORE_PASSWORD=dialysis
      export BUBBLEWRAP_KEY_PASSWORD=dialysis
      echo -e "\n\n" | bubblewrap build

  - name: Upload APK Artifact
    uses: actions/upload-artifact@v3
    with:
      name: dialysis-time-optimizer-apk
      path: android-project/*.apk
