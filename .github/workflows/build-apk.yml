name: Build APK

on: [push]

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4
- name: Setup Node
uses: actions/setup-node@v4
with:
node-version: '18'
- name: Install Bubblewrap
run: npm install -g @bubblewrap/cli
- name: Build
run: |
mkdir -p android-project
bubblewrap init --manifest=https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.json --directory=./android-project
cd android-project
bubblewrap build
- name: Upload
uses: actions/upload-artifact@v4
with:
name: app-apk
path: android-project/*.apk
