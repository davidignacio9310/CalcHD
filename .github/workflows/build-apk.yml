name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create package structure
        run: |
          mkdir -p final_app
          cp index.html final_app/index.html
          cp icono.png final_app/icono.png
          
      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: Dialysis-App-Files
          path: final_app/
