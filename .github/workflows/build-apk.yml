name: Build APK from PWA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/pwakit

      - name: Generate Android Project
        run: |
          # Genera el proyecto Android desde el index.html
          # Se asume que el manifest está incrustado o accesible localmente
          pwabuilder package --platforms android --path . --output ./output
        
      - name: Build APK
        working-directory: ./output/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DialysisTimeOptimizer
          path: output/android/app/build/outputs/apk/debug/app-debug.apk
