name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate and Build
        run: |
          # Inicializa el proyecto TWA automáticamente basándose en tu manifest
          # --name es el nombre del proyecto, --url es la ruta local
          bubblewrap init --manifest=https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.json
          bubblewrap build
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DialysisTimeOptimizer
          path: app/build/outputs/apk/release/app-release-signed.apk
